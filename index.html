<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Ventas</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    
    <!-- ✅ Favicon con emoji (100% confiable) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
    
    <style>
        /* Estilos adicionales para la página de bienvenida */
        .welcome-card .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .welcome-card .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .welcome-card .features .feature-item {
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .welcome-card .features .feature-item i {
            margin-right: 8px;
            width: 20px;
            text-align: center;
            color: #667eea;
        }
        .welcome-card h1 {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }
        .welcome-card h1 i {
            color: #667eea;
        }
        .welcome-card p {
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }
        @media (max-width: 480px) {
            .welcome-card .features {
                grid-template-columns: 1fr;
            }
        }
        
        /* Estilo para el botón de tema en index */
        .theme-toggle-index {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        .theme-toggle-index:hover {
            transform: scale(1.05);
            border-color: #667eea;
        }
        .theme-toggle-index i {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-card">
            <!-- ===== BOTÓN DE MODO OSCURO ===== -->
            <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                <button id="themeToggle" class="theme-toggle-index" title="Cambiar tema">
                    <i class="fas fa-moon" id="themeIcon"></i>
                    <span id="themeText">Oscuro</span>
                </button>
            </div>

            <h1><i class="fas fa-store"></i> Sistema de Ventas</h1>
            <p style="font-size: 1.2em;">
                <i class="fas fa-boxes"></i> Gestión de productos, inventario y ventas en tiempo real
            </p>
            
            <div class="features">
                <div class="feature-item">
                    <i class="fas fa-box"></i> Gestión de productos
                </div>
                <div class="feature-item">
                    <i class="fas fa-clipboard-list"></i> Control de inventario
                </div>
                <div class="feature-item">
                    <i class="fas fa-money-bill-wave"></i> Registro de ventas
                </div>
                <div class="feature-item">
                    <i class="fas fa-sync-alt"></i> Actualización en tiempo real
                </div>
            </div>

            <a href="login.html" class="btn btn-primary" style="font-size: 1.1em; padding: 12px 40px;">
                <i class="fas fa-lock"></i> Iniciar Sesión
            </a>

            <div class="subtitle">
                <i class="fas fa-info-circle"></i> <strong>Demo:</strong> admin@ventas.com / admin123
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module">
        import './js/theme.js';
    </script>
</body>
</html>
